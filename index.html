      /* Boot screen: drawn by the browser before any JavaScript runs, removed once the first view is ready. */
      html,body{margin:0;background:#04050A}
      #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
      #boot{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;background:#04050A;color:#A4ABBD;font:500 12px/1 "Geist Mono",ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;transition:opacity .6s ease,visibility .6s}
      #boot.done{opacity:0;visibility:hidden}
      #boot .rk{width:26px;height:44px;position:relative;animation:hover 2.4s ease-in-out infinite}
      #boot .rk svg{display:block;width:26px;height:auto}
      #boot .fl{position:absolute;left:50%;top:38px;width:6px;height:18px;margin-left:-3px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:linear-gradient(#FFF6D8,#FFC77A 40%,rgba(120,180,255,.6) 80%,transparent);transform-origin:50% 0;animation:fl .12s ease-in-out infinite alternate}
      #boot .tr{width:160px;height:1px;background:rgba(220,226,240,.12);overflow:hidden}
      #boot .tr i{display:block;height:100%;width:100%;background:#FFC77A;transform-origin:0 50%;transform:scaleX(calc(.08 + var(--boot,0)*.92));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
      @keyframes hover{50%{transform:translateY(-6px)}}
      @keyframes fl{to{transform:scaleY(.72) scaleX(.85)}}
      @media (prefers-reduced-motion:reduce){#boot .rk,#boot .fl{animation:none}}
    </style>
